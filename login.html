<!DOCTYPE html>
<html>
<head>
    <title>Login Cyber AI</title>
<!-- 1. Firebase App (Bumbu Utama) -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>

<!-- 2. Firebase Auth (Untuk Login) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<!-- 3. INI YANG KURANG: Firebase Firestore (Untuk Database) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <h1 class="text1">Selamat Datang di Whale Shark AI</h1>
        <h2 class="text2">Silakan Masuk untuk Melanjutkan</h2>
        
        <button onclick="loginGoogle()" class="login-btn">
                <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/24px.svg" alt="Google Logo">
            <span>Masuk dengan Google</span>
        </button>
        <button onclick="loginGoogle()" class="login-git">
                <i class="fa-brands fa-github"></i>
            <span>Masuk dengan GitHub</span>
        </button>
        <button onclick="loginGoogle()" class="login-fb">
                <i class="fa-brands fa-facebook"></i>
            <span>Masuk dengan Facebook</span>
        </button>
        <img src="kimura2-mountain-477832_1920.jpg" alt="gunung" class="iklan">
    </div>

    <script src="login.js"></script>
</body>
</html>
