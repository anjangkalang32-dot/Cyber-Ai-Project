<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber AI - King Edition</title>
    <link rel="stylesheet" href="cyber.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <div class="main-container">
        <div id="chat-box">
            <div id="welcome-screen">
                <div class="logo-wrapper"> <img src="logo.png" alt="Cyber AI Logo" class="center-logo">
                </div>
                <p>Selamat datang di Cyber AI!</p>
            </div>
        </div>
        <div class="input-area">
            <input type="file" id="file-input" accept="image/*" style="display: none;">
            
            <button id="upload-btn" type="button"><span class="material-symbols-outlined">
add_a_photo
</span></button>
            
            <input type="text" id="user-input" placeholder="Ketik pesan atau upload gambar...">
            <button id="send-button">Kirim</button>
        </div>
    </div>

    <script src="cyber.js"></script>
</body>
</html>
