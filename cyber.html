<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>WhaleShark - Beta</title>
    <meta name="referrer" content="no-referrer">
    <link rel="stylesheet" href="cyber.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="icon" type="image/png" href="whale_shark.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="menu-toggle" onclick="toggleSidebar()">
    <i class="fas fa-bars"></i>
</div>
<div id="sidebar" class="sidebar-hidden">
    <div class="sidebar-top">
        <button id="sidebar-toggle-btn" onclick="toggleSidebar()" class="icon-btn" title="Tutup/buka sidebar" aria-label="Tutup/buka sidebar">
            <i class="fa-solid fa-bars"></i>
        </button>
        <span class="sidebar-logo">WhaleShark AI</span>
    </div>

    <div class="sidebar-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="sidebar-search-input" placeholder="Cari chat..." oninput="filterRiwayat(this.value)">
    </div>

    <nav class="sidebar-nav">
        <button onclick="mulaiChatBaru()" class="nav-item" title="Chat Baru">
            <i class="fa-solid fa-plus"></i><span>Chat Baru</span>
        </button>
        <button onclick="ubahNamaChat()" class="nav-item" title="Ganti Nama Chat">
            <i class="fa-solid fa-pen"></i><span>Ganti Nama Chat</span>
        </button>
    </nav>

    <div class="sidebar-content">
        <p class="history-label">Terbaru</p>
        <div id="riwayat-list"></div>
    </div>

    <div class="sidebar-footer">
        <button onclick="bukaSetting()" class="user-pill" title="Setelan">
            <span class="user-avatar"><i class="fa-solid fa-user"></i></span>
            <span class="user-info">
                <span class="user-name">Akun Saya</span>
                <span class="user-plan">Setelan</span>
            </span>
            <i class="fa-solid fa-gear user-pill-icon"></i>
        </button>
    </div>
</div>
<div id="overlay" onclick="toggleSidebar()"></div>
    <button id="login-btn" onclick="Login()" style="
    position: absolute;
    top: 15px;
    right: 15px;
    width: 45px;
    height: 45px;
    background: #4285F4;
    color: white;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    font-weight: bold;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    z-index: 1000;
    transition: all 0.3s ease;
">
  <span id="login-text" class="material-symbols-outlined">
account_circle
</span>
</button>
    <div class="main-container">
        <div id="chat-box">
            <div id="welcome-screen">
                <div class="logo-wrapper"> <img src="whale_shark.png" alt="Cyber AI Logo" class="center-logo">
                </div>
                <p></p>
            </div>
        </div>

        <div class="input-area">
            <div class="composer">
                <div id="attachment-previews" class="attachment-previews">
                    <div id="image-preview-container" class="preview-chip preview-chip-image" style="display: none;">
                        <div class="preview-thumb">
                            <img id="image-preview" src="" alt="Preview gambar">
                        </div>
                        <button type="button" class="preview-remove" onclick="cancelImage()" aria-label="Hapus gambar"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div id="document-preview-container" class="preview-chip preview-chip-doc" style="display: none;">
                        <div class="preview-doc-icon"><i class="fa-solid fa-file-lines"></i></div>
                        <span id="document-preview-name" class="preview-doc-name"></span>
                        <button type="button" class="preview-remove" onclick="cancelDocument()" aria-label="Hapus dokumen"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>

                <textarea id="user-input" class="composer-input" placeholder="Tanya Whale Shark..." rows="1"></textarea>

                <div class="composer-toolbar">
                    <div class="composer-toolbar-left">
                        <button id="upload-btn" type="button" aria-label="Lampirkan file"><i class="fa-solid fa-plus"></i></button>
                        <input type="file" id="file-input" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt,.json" style="display: none;">
                    </div>
                    <div class="composer-toolbar-right">
                        <div class="model-picker">
                            <button id="model-button" type="button" aria-haspopup="true" aria-expanded="false">
                                <span id="selected-model-label">Groq</span>
                                <i class="fa-solid fa-chevron-down"></i>
                            </button>
                            <div id="model-menu" class="model-menu">
                                <button class="model-option selected" type="button" data-model="groq">
                                    <strong>Groq</strong>
                                    <div class="model-subtitle">Llama 4 Scout</div>
                                </button>
                                <button class="model-option" type="button" data-model="gpt-oss">
                                    <strong>OpenAI GPT-OSS</strong>
                                    <div class="model-subtitle">openai/gpt-oss-120b</div>
                                </button>
                                <button class="model-option" type="button" data-model="gemini">
                                    <strong>Gemini</strong>
                                    <div class="model-subtitle">3.5 Flash</div>
                                </button>
                            </div>
                        </div>
                        <button id="send-button" aria-label="Kirim pesan"><i class="fa-solid fa-arrow-up"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <script src="cyber.js"></script>
</body>
</html>
